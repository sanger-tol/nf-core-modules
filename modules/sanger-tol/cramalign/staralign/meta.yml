name: cramalign_staralign
description: Align reads to a reference genome using STAR
keywords:
  - align
  - fasta
  - genome
  - reference
tools:
  - star:
      description: |
        STAR is a software package for mapping DNA sequences against
        a large reference genome, such as the human genome.
      homepage: https://github.com/alexdobin/STAR
      manual: https://github.com/alexdobin/STAR/blob/master/doc/STARmanual.pdf
      doi: 10.1093/bioinformatics/bts635
      licence: ["MIT"]
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats, written by Heng Li.
        These files are generated as output by short read aligners like BWA.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - cram:
        type: file
        description: |
          Cram file containing interleved paired-end illumina reads
        pattern: "*.cram"
        ontologies:
          - edam: "http://edamontology.org/format_3462" # CRAM
    - crai:
        type: file
        description: CRAM index file
        pattern: "*.crai"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - rglines:
        type: list
        description: A list of strings, each a valid SAM-format @RG header line, to pass to the aligner
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - index:
        type: directory
        description: STAR genome index
        pattern: "star"
    - assembly:
        type: file
        description: reference genome assembly
        pattern: "*.fasta(.gz)?"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - chunkn:
        type: integer
        description: Integer index of CRAM chunk to map
    - range:
        type: list
        description: Start and end indices defining CRAM slices to align
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - '*.star.bam':
          type: file
          description: BAM file of mapped sequences
          pattern: "*.star.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572"
  versions_star:
    - - ${task.process}:
          type: string
          description: The name of the process
      - star:
          type: string
          description: The name of the tool
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | head -1 | sed -e "s/samtools //":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - star:
          type: string
          description: The name of the tool
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | head -1 | sed -e "s/samtools //":
          type: eval
          description: The expression to obtain the version of the tool

