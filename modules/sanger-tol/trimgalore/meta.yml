name: trimgalore
description: |
  A wrapper around Cutadapt and FastQC to consistently apply adapter and quality trimming to FastQ files,
  with extra functionality for RRBS data
keywords:
  - trimming
  - adapters
  - sequencing
  - fastq
tools:
  - trimgalore:
      description: |
        A wrapper tool around Cutadapt and FastQC to consistently apply quality
        and adapter trimming to FastQ files, with some extra functionality for
        MspI-digested RRBS-type (Reduced Representation Bisufite-Seq) libraries.
      homepage: https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/
      documentation: https://github.com/FelixKrueger/TrimGalore/blob/master/Docs/Trim_Galore_User_Guide.md
      licence:
        - "GPL-3.0-or-later"
      identifier: biotools:trim_galore

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - cram:
        type: file
        description: |
          Cram file of interleaved paired-end illumina sequencing data
        ontologies:
          - edam: "http://edamontology.org/format_3462" # CRAM
output:
  cram:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*{trimmed,val}.cram":
          type: file
          description: The trimmed/modified fastq reads
          pattern: "*{trimmed,val}.cram"
          ontologies:
            - edam: http://edamontology.org/format_3462 # CRAM
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*report.txt":
          type: file
          description: trimgalore log file
          pattern: "*report.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.html":
          type: file
          description: FastQC HTML report after trimming when the --fastqc flag is used
          pattern: "*_fastqc.html"
          ontologies:
            - edam: "http://edamontology.org/format_2331" # HTML
  zip:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.zip":
          type: file
          description: FastQC report output zip after trimming when the --fastqc flag is used
          pattern: "*_fastqc.zip"
          ontologies:
            - edam: http://edamontology.org/format_3987 # ZIP format
  versions_trimgalore:
    - - ${task.process}:
          type: string
          description: The name of the process
      - trimgalore:
          type: string
          description: The name of the tool
      - trim_galore --version | grep -Eo "[0-9]+(\.[0-9]+)+":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - trimgalore:
          type: string
          description: The name of the tool
      - trim_galore --version | grep -Eo "[0-9]+(\.[0-9]+)+":
          type: eval
          description: The expression to obtain the version of the tool

