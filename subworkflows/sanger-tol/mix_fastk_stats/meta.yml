# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/subworkflows/yaml-schema.json
name: "mix_fastk_stats"
description: Haplotype mixing and FASTK statistics
keywords:
  - genome_statistics
  - cat
  - fastk
  - longreads
  - assembly
  - qc
  - merquryfk
  - busco
components:
  - genome_statistics
  - find/concatenate:
      git_remote: https://github.com/nf-core/modules.git
  - fastk/fastk:
      git_remote: https://github.com/nf-core/modules.git

input:
  - ch_reference:
      type: file
      description: |
        Input fasta reference assembly.

        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{(fasta,fa,fna)}"
  - ch_haplotypes:
      type: file
      description: |
        Input haplotypes fasta reference assembly. This channel is joined with
        `ch_reference` on the meta map, so the meta of a given sample must be
        identical in both channels. Samples with no haplotypes may be omitted.

        Structure: [ val(meta), [path(fasta)] ]
      pattern: "*.{(fasta,fa,fna)}"
  - ch_longreads:
      type: file
      description: |
        Input haplotypes fasta reference assembly.

        Structure: [ val(meta), [path(fasta.gz)] ]
      pattern: "*.{(fasta,fa,fna).gz}"
  - ch_kmer_dir:
      type: file
      description: |
        Input directory containing k-mer db files.

        Structure: [ val(meta), path(directory) ]
  - ch_busco:
      type: file
      description: |
        BUSCO directory containing the `lineages` directory.

        Structure: [ val(meta), path(directory) ]
  - val_busco_lineage:
      type: string
      description: |
        Specific BUSCO lineage to use for the analysis.
  - val_existing_fastk:
      type: boolean
      description: |
        Whether fastk db files have been pre-generated.
  - val_run_busco:
      type: boolean
      description: |
        Whether to run the BUSCO tool.

output:
  - stats:
      type: file
      description: |
        Channel containing assembly statistics from asmstats.
        Structure: [ val(meta), path(stats) ]
      pattern: "*.stats"
  - asmstats:
      type: file
      description: |
        Channel containing assembly statistics from asmstats.
        Structure: [ val(meta), path(stats) ]
      pattern: "*.bam"
  - busco_summary_txt:
      type: file
      description: |
        BUSCO summary in txt format.
        Structure: [ val(meta), path(summary) ]
      pattern: "*.txt"
  - busco_summary_json:
      type: file
      description: |
        BUSCO summary in JSON format.
        Structure: [ val(meta), path(summary) ]
      pattern: "*.json"
  - merqury_qv:
      type: file
      description: |
        MerquryFK QV estimates for each assembly.
        Structure: [ val(meta), path(qv) ]
      pattern: "*.qv"
  - merqury_completeness:
      type: file
      description: |
        MerquryFK kmer completeness estimates for each assembly.
        Structure: [ val(meta), path(completeness) ]
      pattern: "*.completeness.stats"
  - merqury_phased_stats:
      type: file
      description: |
        MerquryFK kmer phasing estimates for each assembly.
        Structure: [ val(meta), path(phasing) ]
      pattern: "*.phased_block.stats"
  - merqury_images:
      type: file
      description: |
        MerquryFK plots - both CNI, ASM and phasing.

        Structure: [ val(meta), path(image) ]
      pattern: "*.{png,pdf}"
  - fastkdb:
      type: file
      description: |
        The fastkdb files, derived from the pre-existing fastk directory or
        FASTK module.

        Structure: [ val(meta), path(ktabs), path(hists) ]
      pattern: "*.ktab.* | *.hist"
  - cross_hap_collection:
      type: file
      description: |
        A cross mapping of pseudo primary assembly
        against a contatenated pseudo haplotype file. Each assembly of a sample
        (primary and haplotypes) appears once as the pseudo primary, paired with
        the concatenation of all of the remaining assemblies of that sample.

        The meta map additionally contains `ori_id` (the original sample id),
        `real_primary` (the actual primary assembly), `type` ("PRIMARY" or
        "HAP"), `hap_num` (assembly counter, where the actual primary is always
        0) and `hap_id` ("{ori_id}_{type}_{hap_num}", also used as the row id).

        Structure: [ val(meta), path(pseudo_primary), path(pseudo_haplotype) ]
      pattern: "*.{(fasta,fa,fna)}"
authors:
  - "@DLBPointon"
maintainers:
  - "@DLBPointon"
