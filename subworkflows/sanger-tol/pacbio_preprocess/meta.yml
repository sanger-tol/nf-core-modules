# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/subworkflows/yaml-schema.json
name: "pacbio_preprocess"
description: "Preprocesses standard, ULI, PiMmS, and amplified PacBio reads with library-specific demultiplexing, duplicate marking, and optional adapter trimming."
keywords:
  - pacbio
  - demultiplex
  - adapter-trimming
  - duplicate-marking
components:
  - blast/blastn
  - blast/makeblastdb:
      git_remote: https://github.com/nf-core/modules.git
  - hifitrimmer/processblast:
      git_remote: https://github.com/nf-core/modules.git
  - hifitrimmer/trim:
      git_remote: https://github.com/nf-core/modules.git
  - lima:
      git_remote: https://github.com/nf-core/modules.git
  - pbmarkdup:
      git_remote: https://github.com/nf-core/modules.git
  - untar:
      git_remote: https://github.com/nf-core/modules.git

input:
  - ch_reads_standard:
      type: file
      description: |
        Standard PacBio reads passed directly to optional HiFiTrimmer adapter trimming.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.(bam|fastq|fq|fasta|fa|fna)(.gz)?"
  - ch_reads_uli:
      type: file
      description: |
        ULI PacBio reads processed with LIMA using the global ULI adapter file, then with pbmarkdup.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.(bam|fastq|fq|fasta|fa|fna)(.gz)?"
  - ch_reads_pimms:
      type: file
      description: |
        PiMmS PacBio reads processed with LIMA using a matching per-sample adapter file, then with pbmarkdup.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.(bam|fastq|fq|fasta|fa|fna)(.gz)?"
  - ch_reads_amplified:
      type: file
      description: |
        Amplified PacBio reads processed with pbmarkdup without prior LIMA demultiplexing.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.(bam|fastq|fq|fasta|fa|fna)(.gz)?"
  - ch_adapter_yaml:
      type: file
      description: |
        Per-sample HiFiTrimmer configuration. Its meta map must match the reads to trim.
        Structure: [ val(meta), path(yaml) ]
      pattern: "*.yaml"
  - ch_pimms_adapters:
      type: file
      description: |
        Per-sample PiMmS adapter FASTA used by LIMA. Its meta map must match ch_reads_pimms.
        Structure: [ val(meta), path(adapter) ]
      pattern: "*.(fasta|fa|fna)"
  - val_hifi_adapter:
      type: file
      description: |
        HiFi adapter BLAST database archive or FASTA used to build a database. An empty value disables adapter trimming.
      pattern: "*.(tar.gz|fasta|fa|fna)"
  - val_uli_adapter:
      type: file
      description: |
        Global ULI adapter FASTA used by LIMA for barcode demultiplexing.
      pattern: "*.(fasta|fa|fna)"

output:
  - untrimmed_fastx:
      type: file
      description: |
        Channel containing preprocessed reads that are not filtered/trimmed with hifitrimmer in FASTA/FASTQ format.
        Structure: [ val(meta), path(fasta/fastq) ]
      pattern: "*.fasta|*.fa|*.fastq|*.fq"
  - untrimmed_bam:
      type: file
      description: |
        Channel containing preprocessed reads that are not filtered/trimmed with hifitrimmer in BAM format.
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - trimmed_cram:
      type: file
      description: |
        Channel containing preprocessed reads that have been filtered/trimmed with hifitrimmer in CRAM format.
        Structure: [ val(meta), path(cram) ]
      pattern: "*.cram"
  - trimmed_bam:
      type: file
      description: |
        Channel containing preprocessed reads that have been filtered/trimmed with hifitrimmer in BAM format.
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - trimmed_sam:
      type: file
      description: |
        Channel containing preprocessed reads that have been filtered/trimmed with hifitrimmer in SAM format.
        Structure: [ val(meta), path(sam) ]
      pattern: "*.sam"
  - trimmed_fasta:
      type: file
      description: |
        Channel containing preprocessed reads that have been filtered/trimmed with hifitrimmer in FASTA format.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.fasta|*.fa|*.fna"
  - trimmed_fastq:
      type: file
      description: |
        Channel containing preprocessed reads that have been filtered/trimmed with hifitrimmer in FASTQ format.
        Structure: [ val(meta), path(fastq) ]
      pattern: "*.fastq|*.fq"
  - lima_report:
      type: file
      description: |
        LIMA demultiplexing reports for ULI reads and matched PiMmS reads.
        Structure: [ val(meta), path(report) ]
      pattern: "*.lima.report"
  - lima_summary:
      type: file
      description: |
        LIMA demultiplexing summaries for ULI reads and matched PiMmS reads.
        Structure: [ val(meta), path(summary) ]
      pattern: "*.lima.summary"
  - hifitrimmer_bed:
      type: file
      description: |
        HiFiTrimmer adapter coordinates for reads with matching YAML configuration.
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed.gz"
  - hifitrimmer_summary:
      type: file
      description: |
        HiFiTrimmer summaries for reads with matching YAML configuration.
        Structure: [ val(meta), path(summary) ]
      pattern: "*.summary.json"
  - pbmarkdup_stats:
      type: file
      description: |
        pbmarkdup logs for ULI, matched PiMmS, and amplified reads.
        Structure: [ val(meta), path(log) ]
      pattern: "*.pbmarkdup.log"
authors:
  - "@sainsachiko"
maintainers:
  - "@sainsachiko"
